<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台股科技供應鏈・知識庫 (Stock Wiki)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1e293b; --paper:#fffaf0; --muted:#64748b;
  --green:#34d399; --green-soft:#d1fae5;
  --amber:#fbbf24; --amber-soft:#fef3c7;
  --sky:#38bdf8; --sky-soft:#e0f2fe;
  --pink:#fb7185; --pink-soft:#ffe4e6;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  color:var(--ink); line-height:1.75; background:var(--paper);
  background-image:radial-gradient(rgba(30,41,59,.13) 1.2px, transparent 1.2px);
  background-size:22px 22px; min-height:100vh;
}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}

/* top bar */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.05rem;cursor:pointer;border:0;background:none;color:var(--ink)}
.brand .logo{width:38px;height:38px;border-radius:12px;background:var(--green);border:2px solid var(--ink);display:grid;place-items:center;box-shadow:2px 2px 0 var(--ink)}
.pill{font-size:.72rem;font-weight:700;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:3px 12px}

/* hero */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:center;padding:34px 0 26px}
.kicker{display:inline-block;font-weight:700;font-size:.8rem;background:var(--amber-soft);border:2px solid var(--ink);border-radius:999px;padding:2px 14px;margin-bottom:14px}
.hero h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:900;line-height:1.2;margin-bottom:14px}
.hero h1 mark{background:linear-gradient(transparent 58%,var(--green) 58%);color:inherit;padding:0 4px}
.hero p{color:#475569;max-width:34em}
.mascot{justify-self:center;position:relative;width:min(260px,70vw);aspect-ratio:1;border-radius:50%;
  background:var(--sky-soft);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);display:grid;place-items:center;font-size:6rem}
.mascot .chip{position:absolute;font-size:1.6rem;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:2px 10px;box-shadow:2px 2px 0 var(--ink)}
.mascot .c1{top:6%;right:-6%;transform:rotate(8deg)}
.mascot .c2{bottom:8%;left:-8%;transform:rotate(-8deg)}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}

/* library */
.section-title{font-size:1.3rem;font-weight:900;margin:18px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:22px}
.card{display:flex;flex-direction:column;text-align:left;background:#fff;border:3px solid var(--ink);border-radius:20px;
  padding:20px;box-shadow:6px 6px 0 var(--ink);transition:transform .15s, box-shadow .15s}
.card:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--ink)}
.card:active{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--ink)}
.tag{align-self:flex-start;font-size:.75rem;font-weight:700;border:2px solid var(--ink);border-radius:999px;padding:1px 12px;margin-bottom:12px}
.t-green{background:var(--green-soft)} .t-amber{background:var(--amber-soft)} .t-sky{background:var(--sky-soft)} .t-pink{background:var(--pink-soft)}
.card .emoji{font-size:2rem;margin-bottom:4px}
.card h3{font-size:1.2rem;font-weight:900}
.card .names{font-size:.82rem;color:var(--muted);margin:2px 0 8px;font-weight:500}
.card .desc{font-size:.9rem;color:#475569;flex:1;margin-bottom:14px}
.card .foot{display:flex;justify-content:space-between;align-items:center;border-top:2px dashed #cbd5e1;padding-top:12px;font-size:.8rem;font-weight:700}
.card .meta span{margin-right:10px;color:var(--muted)}
.go{background:var(--ink);color:#fff;border-radius:999px;padding:3px 14px}
.soon{margin:34px auto 10px;text-align:center;color:var(--muted);font-weight:700}
.soon .egg{font-size:2.2rem;display:block}

/* reader */
.reader-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0 18px;flex-wrap:wrap}
.btn{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:5px 16px;font-weight:700;font-size:.85rem;box-shadow:2px 2px 0 var(--ink);color:var(--ink)}
.btn:hover{background:var(--amber-soft)}
.btn[disabled]{opacity:.35;pointer-events:none}
.progress{display:flex;align-items:center;gap:10px;font-size:.8rem;font-weight:700;color:var(--muted)}
.dots{display:flex;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:#fff;padding:0}
.dot.on{background:var(--green)}
.paper{background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:7px 7px 0 var(--ink);padding:34px 38px;min-height:420px}
.paper .badge{display:inline-block;font-size:.78rem;font-weight:700;border:2px solid var(--ink);border-radius:999px;padding:1px 12px;margin-bottom:10px}
.article h2{font-size:1.7rem;font-weight:900;margin-bottom:14px;line-height:1.35}
.article h3{font-size:1.1rem;font-weight:900;margin:26px 0 10px;display:inline-block;background:linear-gradient(transparent 60%,var(--amber-soft) 60%)}
.article p{margin-bottom:.8rem;color:#374151}
.article ul{padding-left:1.3rem;margin-bottom:1rem;color:#374151}
.article li{margin-bottom:.4rem}
.article a{color:#047857;font-weight:700}
.article .tbl-wrap{overflow-x:auto;margin:.5rem 0 1.2rem;border:2px solid var(--ink);border-radius:14px}
.article table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:560px}
.article th{background:var(--green-soft);text-align:left;padding:.6rem .8rem;border-bottom:2px solid var(--ink)}
.article td{padding:.6rem .8rem;border-top:1px solid #e2e8f0;vertical-align:top}
.article tr:first-child td{border-top:0}
.chain{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.6rem 0 1.3rem;font-size:.85rem}
.chain .box{background:var(--green-soft);border:2px solid var(--ink);padding:.3rem .8rem;border-radius:12px;font-weight:700}
.chain .arrow{color:var(--muted);font-weight:900}
.article .tag{display:inline-block;font-size:.72rem;font-weight:700;background:var(--sky-soft);border:1.5px solid var(--ink);border-radius:999px;padding:0 10px;margin:0 6px 0 0}
.reader-nav{display:flex;justify-content:space-between;margin:24px 0 8px;gap:10px}

footer{text-align:center;font-size:.78rem;color:var(--muted);padding:40px 0 30px}
.hidden{display:none!important}
@media(max-width:760px){
  .hero{grid-template-columns:1fr}
  .mascot{order:-1;width:170px;font-size:4rem}
  .paper{padding:22px 18px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <button class="brand" id="logo"><span class="logo">📈</span> Stock &amp; Tech Wiki</button>
    <span class="pill">LLM Wiki 架構</span>
  </div>

  <!-- 首頁 -->
  <div id="home">
    <section class="hero">
      <div>
        <span class="kicker">台股 × AI 供應鏈</span>
        <h1>一起潛進<mark>台股供應鏈</mark>,看懂 AI 背後的材料。</h1>

  <footer>&copy; 2026 Stock &amp; Tech Wiki ・ 內容整理自公開資料,僅供學習研究,非投資建議 🐳</footer>
</div>

            h += `<tr><td>${r[0]}</td><td><strong>${r[1]}</strong></td><td>${r[2]}</td><td>${r[3]}</td></tr>`;
        });
        return h + '</tbody></table></div>';
    }

    function chain(items) {
        return '<div class="chain">' + items.map((t, i) =>

    const pages = [

            html: `
<h2>玻纖布 (Fiberglass Cloth) 與台股供應鏈</h2>

<h3>1. 產業定位:電子產業的「骨架」與絕緣基材</h3>
<p>玻纖布本身不能運算,但它是 AI 伺服器、筆電、網通設備、手機中<strong>印刷電路板 (PCB)</strong> 的結構骨架。</p>
<ul>
  <li><strong>物理角色</strong>:由極細玻璃纖維織造而成,提供機械強度、耐熱性與尺寸安定性,避免電路板受熱變形。</li>
  <li><strong>電氣角色</strong>:與環氧樹脂結合成銅箔基板 (CCL) 的基材,提供絕緣,讓高速訊號不短路、不互相干擾。</li>
  <li><strong>AI 時代新定位</strong>:AI 伺服器與高速交換器要求更低的訊號損耗與更小的熱膨脹,因此需要 Low Dk(低介電常數)與 Low CTE(低熱膨脹係數)的高階玻纖布,例如 T-glass。</li>
</ul>

<h3>2. 常見名詞</h3>
<ul>
  <li><strong>E-glass</strong>:最基本的玻纖布等級,用於一般電子產品。</li>
  <li><strong>Low Dk / Low Df</strong>:數值越低,高速訊號損耗越小。</li>
  <li><strong>Low CTE (T-glass)</strong>:熱膨脹係數低,有利於大尺寸 IC 載板,日東紡 (Nittobo) 為主要供應商。</li>
  <li><strong>Q-glass (石英布)</strong>:對應更高階 M9 世代材料的超低損耗布種。</li>
</ul>

<h3>3. 供應鏈上下游</h3>
${chain(['玻璃原料、玻纖紗', '<b>玻纖布織造</b>', '銅箔基板 CCL', 'PCB / IC 載板', 'AI 伺服器、交換器'])}

    ['5475', '德宏', '玻纖布', '台灣電子級玻纖布廠之一,差異化主攻石英纖維 (Q-glass),對應 M9 世代。基期較低,營運彈性大。'],
    ['1303', '南亞', '垂直整合集團', '台塑集團成員,從玻纖布、多層紗、銅箔、環氧樹脂到銅箔基板與載板都有布局,屬完整垂直整合模式。']

<p><span class="tag">注意</span>玻纖布占各家營收比重與高階產品進度差異很大,不同公司並非同質,研究時應分開看。</p>

    ['6274', '台燿', '高頻高速 CCL', '長期深耕伺服器與高階交換器,國內較早取得國際大廠認證的高頻高速 CCL 廠。'],

<ul>
  <li><a href="#fiberglass" class="text-emerald-700 underline">電子級玻纖布</a></li>
  <li><a href="#ccl" class="text-emerald-700 underline">銅箔基板 (CCL)</a></li>
</ul>`
        }
    ];

    

// ========= 每個頁面的卡片資訊 (順序依供應鏈上游→下游) =========
const meta = {
  fiberglass: { order:1, tag:'上游材料', color:'green', desc:'AI 伺服器 PCB 的「骨架」。認識 Low Dk、Low CTE、T-glass,以及為什麼高階玻纖布會缺貨。', companies:5, mins:4 },
  copperfoil: { order:2, tag:'上游材料', color:'amber', desc:'高速訊號跑在銅箔表面,越平滑損耗越小。看懂特殊銅箔為何成為新題材。', companies:2, mins:2 },
  ccl:        { order:3, tag:'中游基材', color:'sky',   desc:'玻纖布 + 樹脂 + 銅箔壓合成 CCL。從 M8 升級到 M9,台廠三雄各自的強項。', companies:5, mins:3 },
  pcb:        { order:4, tag:'下游製造', color:'pink',  desc:'PCB 與 ABF 載板是需求的出口,也是材料漲價最後傳導的地方。', companies:4, mins:2 }
};
pages.sort((a,b) => meta[a.id].order - meta[b.id].order);

const home = document.getElementById('home');
const reader = document.getElementById('reader');
const container = document.getElementById('content-container');
const grid = document.getElementById('card-grid');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
let current = -1;

// 建立卡片
pages.forEach(p => {
  const m = meta[p.id];
  const b = document.createElement('button');
  b.className = 'card';
  b.innerHTML = `
    <span class="tag t-${m.color}">${m.tag}</span>
    <span class="emoji">${p.icon}</span>
    <h3>${p.title}</h3>
    <div class="names">${p.subtitle}</div>
    <div class="desc">${m.desc}</div>
    <div class="foot"><div class="meta"><span>🏢 ${m.companies} 家公司</span><span>⏱ ${m.mins} 分鐘</span></div><span class="go">開始 →</span></div>`;
  b.addEventListener('click', () => showPage(p.id));
  grid.appendChild(b);
});

// 進度小圓點
const dots = document.getElementById('dots');
pages.forEach((p, i) => {
  const d = document.createElement('button');
  d.className = 'dot';
  d.title = p.title;
  d.addEventListener('click', () => showPage(p.id));
  dots.appendChild(d);
});

function showHome() {
  current = -1;
  reader.classList.add('hidden');
  home.classList.remove('hidden');
  history.replaceState(null, '', location.pathname);
  window.scrollTo({ top: 0 });
}

function showPage(id) {
  const i = pages.findIndex(p => p.id === id);
  if (i < 0) return showHome();
  current = i;
  const p = pages[i], m = meta[p.id];
  home.classList.add('hidden');
  reader.classList.remove('hidden');
  container.innerHTML = `<span class="badge t-${m.color}">${m.tag}</span>` + p.html;
  document.getElementById('pos').textContent = `${i + 1} / ${pages.length}`;
  dots.querySelectorAll('.dot').forEach((d, k) => d.classList.toggle('on', k === i));
  prevBtn.disabled = i === 0;
  nextBtn.disabled = i === pages.length - 1;
  history.replaceState(null, '', '#' + id);
  window.scrollTo({ top: 0 });
}

document.getElementById('logo').addEventListener('click', showHome);
document.getElementById('back').addEventListener('click', showHome);
prevBtn.addEventListener('click', () => current > 0 && showPage(pages[current - 1].id));
nextBtn.addEventListener('click', () => current < pages.length - 1 && showPage(pages[current + 1].id));

// 內文「相關詞條」連結
container.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]');
  if (a) { e.preventDefault(); showPage(a.getAttribute('href').slice(1)); }
});

// 鍵盤 ← → 翻頁
document.addEventListener('keydown', e => {
  if (current < 0) return;
  if (e.key === 'ArrowLeft' && current > 0) showPage(pages[current - 1].id);
  if (e.key === 'ArrowRight' && current < pages.length - 1) showPage(pages[current + 1].id);
});

const initial = location.hash.slice(1);
initial ? showPage(initial) : showHome();
</script>
</body>
</html>
