<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台股科技產業與關鍵零組件知識庫 (Stock Wiki)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; }

        .article table { width: 100%; border-collapse: collapse; font-size: .875rem; margin: .5rem 0 1.2rem; }
        .article th { background: #f1f5f9; text-align: left; padding: .55rem .7rem; border: 1px solid #e2e8f0; }
        .article td { padding: .55rem .7rem; border: 1px solid #e2e8f0; vertical-align: top; }
        .article .tbl-wrap { overflow-x: auto; }
        .chain { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin: .5rem 0 1.2rem; font-size: .85rem; }
        .chain span.box { background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; padding: .35rem .7rem; border-radius: .5rem; }
        .chain span.arrow { color: #9ca3af; }

    </style>
</head>
<body class="bg-gray-50 text-gray-800 leading-relaxed">

    <script>
    // ========= 資料區:要新增公司或頁面,只要改這裡 =========

    // 公司表格:[代號, 名稱, 供應鏈位置, 說明]
    function companyTable(rows) {
        let h = '<div class="tbl-wrap"><table><thead><tr><th>代號</th><th>公司</th><th>定位</th><th>重點說明</th></tr></thead><tbody>';
        rows.forEach(r => {
            h += `<tr><td>${r[0]}</td><td><strong>${r[1]}</strong></td><td>${r[2]}</td><td>${r[3]}</td></tr>`;
        });
        return h + '</tbody></table></div>';
    }

    function chain(items) {
        return '<div class="chain">' + items.map((t, i) =>
            (i ? '<span class="arrow">➜</span>' : '') + `<span class="box">${t}</span>`).join('') + '</div>';
    }

    const pages = [
        {
            id: 'fiberglass',
            icon: '🧪',
            title: '電子級玻纖布',
            subtitle: '台玻、富喬、建榮、德宏、南亞',
            html: `
<h2>玻纖布 (Fiberglass Cloth) 與台股供應鏈</h2>

<h3>1. 產業定位:電子產業的「骨架」與絕緣基材</h3>
<p>玻纖布本身不能運算,但它是 AI 伺服器、筆電、網通設備、手機中<strong>印刷電路板 (PCB)</strong> 的結構骨架。</p>
<ul>
  <li><strong>物理角色</strong>:由極細玻璃纖維織造而成,提供機械強度、耐熱性與尺寸安定性,避免電路板受熱變形。</li>
  <li><strong>電氣角色</strong>:與環氧樹脂結合成銅箔基板 (CCL) 的基材,提供絕緣,讓高速訊號不短路、不互相干擾。</li>
  <li><strong>AI 時代新定位</strong>:AI 伺服器與高速交換器要求更低的訊號損耗與更小的熱膨脹,因此需要 Low Dk(低介電常數)與 Low CTE(低熱膨脹係數)的高階玻纖布,例如 T-glass。</li>
</ul>

<h3>2. 常見名詞</h3>
<ul>
  <li><strong>E-glass</strong>:最基本的玻纖布等級,用於一般電子產品。</li>
  <li><strong>Low Dk / Low Df</strong>:數值越低,高速訊號損耗越小。</li>
  <li><strong>Low CTE (T-glass)</strong>:熱膨脹係數低,有利於大尺寸 IC 載板,日東紡 (Nittobo) 為主要供應商。</li>
  <li><strong>Q-glass (石英布)</strong>:對應更高階 M9 世代材料的超低損耗布種。</li>
</ul>

<h3>3. 供應鏈上下游</h3>
${chain(['玻璃原料、玻纖紗', '<b>玻纖布織造</b>', '銅箔基板 CCL', 'PCB / IC 載板', 'AI 伺服器、交換器'])}

<h3>4. 代表性台股公司</h3>
${companyTable([
    ['1802', '台玻', '玻纖布(轉型中)', '傳統平板玻璃大廠,近年擴大高階玻纖布。鹿港廠主攻 Low Dk,桃園廠主攻載板用 Low CTE。市場預期高階玻纖布營收占比將追上甚至超過本業。'],
    ['1815', '富喬', '玻纖紗 + 玻纖布', '紗、布垂直整合,積極拉高 Low Dk / Low CTE 等高階產品占比,並布局泰國廠;已完成 M9 級石英布研發,進入客戶認證。'],
    ['5340', '建榮', '玻纖布加工', '日東紡為重要股東,由集團供應玻紗,建榮加工成高階布,T-glass 逐步量產。'],
    ['5475', '德宏', '玻纖布', '台灣電子級玻纖布廠之一,差異化主攻石英纖維 (Q-glass),對應 M9 世代。基期較低,營運彈性大。'],
    ['1303', '南亞', '垂直整合集團', '台塑集團成員,從玻纖布、多層紗、銅箔、環氧樹脂到銅箔基板與載板都有布局,屬完整垂直整合模式。']
])}
<p><span class="tag">注意</span>玻纖布占各家營收比重與高階產品進度差異很大,不同公司並非同質,研究時應分開看。</p>

<h3>5. 產業觀察</h3>
<ul>
  <li>高階玻纖布(尤其 Low CTE / T-glass)供給集中在日東紡,擴產速度跟不上需求,市場普遍預期吃緊延續到 2027 年。</li>
  <li>缺貨也推升上游材料價格,並往下游 CCL、PCB 傳導。</li>
  <li>風險:AI 資本支出放緩、規格變動(例如共封裝光學 CPO 減少 PCB 傳輸距離)、新產能開出後價格回落。</li>
</ul>

<h3>相關詞條</h3>
<ul>
  <li><a href="#ccl" class="text-emerald-700 underline">銅箔基板 (CCL)</a></li>
  <li><a href="#copperfoil" class="text-emerald-700 underline">銅箔</a></li>
  <li><a href="#pcb" class="text-emerald-700 underline">PCB 與 ABF 載板</a></li>
</ul>`
        },
        {
            id: 'ccl',
            icon: '🧱',
            title: '銅箔基板 (CCL)',
            subtitle: '台光電、聯茂、台燿、騰輝',
            html: `
<h2>銅箔基板 (CCL) 與台股供應鏈</h2>

<h3>1. 產業定位</h3>
<p>CCL 由<strong>玻纖布 + 樹脂 + 銅箔</strong>壓合而成,是 PCB 的核心基材。CCL 的等級(常以 M4、M6、M7、M8、M9 表示損耗世代)直接決定高速訊號的品質,是 AI 伺服器與高速交換器升級的關鍵材料。</p>

<h3>2. 供應鏈上下游</h3>
${chain(['玻纖布、樹脂、銅箔', '<b>CCL 銅箔基板</b>', 'PCB / 載板', 'AI 伺服器、交換器、網通'])}

<h3>3. 代表性台股公司</h3>
${companyTable([
    ['2383', '台光電', 'CCL 龍頭', '無鹵素高頻高速材料強項,AI 伺服器、ASIC、交換器客戶為主;積極擴產,法人指訂單能見度到 2027 年,也布局 ABF 用 CCL。'],
    ['6213', '聯茂', 'CCL 第二大', '國內第二大 CCL 供應商,未來數年持續擴產,鎖定 AI 伺服器與低軌衛星;新世代 M9 材料已通過美系客戶認證,預計小量出貨。'],
    ['6274', '台燿', '高頻高速 CCL', '長期深耕伺服器與高階交換器,國內較早取得國際大廠認證的高頻高速 CCL 廠。'],
    ['6672', '騰輝電子-KY', 'CCL', '法人點名的 CCL 供應廠之一,受惠高階材料缺貨與漲價。'],
    ['1303', '南亞', 'CCL + 上游材料', '自有玻纖布、銅箔、樹脂,具垂直整合優勢。']
])}
<p>台光電、聯茂、台燿常被合稱為「CCL 三雄」。</p>

<h3>4. 產業觀察</h3>
<ul>
  <li>材料從 M8 往 M9、M10 世代升級,帶動高階產品占比與平均售價 (ASP) 提升。</li>
  <li>上游玻纖布吃緊是供給端的瓶頸,也是漲價的主因。</li>
  <li>風險:規格調整的傳聞(例如降級使用)、CPO 技術改變 PCB 用量,都曾造成股價大幅波動。</li>
</ul>

<h3>相關詞條</h3>
<ul>
  <li><a href="#fiberglass" class="text-emerald-700 underline">電子級玻纖布</a></li>
  <li><a href="#copperfoil" class="text-emerald-700 underline">銅箔</a></li>
  <li><a href="#pcb" class="text-emerald-700 underline">PCB 與 ABF 載板</a></li>
</ul>`
        },
        {
            id: 'copperfoil',
            icon: '🟠',
            title: '電子銅箔',
            subtitle: '金居、南亞',
            html: `
<h2>電子銅箔與台股供應鏈</h2>

<h3>1. 產業定位</h3>
<p>銅箔是 CCL 表面的導電層,最後被蝕刻成電路。高速傳輸時訊號會集中在導體表面,所以銅箔越平滑(例如 HVLP、反轉銅箔 RTF),訊號損耗越小,對 AI 伺服器特別重要。</p>

<h3>2. 供應鏈上下游</h3>
${chain(['銅原料', '<b>電子銅箔</b>', 'CCL', 'PCB', 'AI 伺服器、交換器、衛星'])}

<h3>3. 代表性台股公司</h3>
${companyTable([
    ['8358', '金居', '特殊銅箔', '降低一般 HTE 銅箔比重,轉向特殊銅箔(占比已超過五成);自研高頻高速反轉銅箔打入 AI 伺服器供應鏈。'],
    ['1303', '南亞', '銅箔 + 整合', '集團內銅箔與 CCL、玻纖布整合,並已調漲玻纖布、多層紗與銅箔價格。']
])}

<h3>相關詞條</h3>
<ul>
  <li><a href="#ccl" class="text-emerald-700 underline">銅箔基板 (CCL)</a></li>
  <li><a href="#fiberglass" class="text-emerald-700 underline">電子級玻纖布</a></li>
</ul>`
        },
        {
            id: 'pcb',
            icon: '🔌',
            title: 'PCB 與 ABF 載板',
            subtitle: '欣興、南電、景碩、金像電',
            html: `
<h2>PCB 與 ABF 載板</h2>

<h3>1. 產業定位</h3>
<p>PCB 是所有電子零件的承載與連接平台;ABF 載板則是連接 AI / 高效能運算晶片與主機板的高階基板。它們是玻纖布、CCL、銅箔的下游,也是需求最直接的出口。</p>

<h3>2. 供應鏈上下游</h3>
${chain(['玻纖布、銅箔、CCL', '<b>PCB / ABF 載板</b>', '伺服器廠、雲端業者'])}

<h3>3. 代表性台股公司</h3>
${companyTable([
    ['3037', '欣興', 'ABF 載板 / PCB', '國內載板大廠,受惠 ABF 載板供應吃緊。'],
    ['8046', '南電', 'ABF 載板', '南亞集團成員,同樣受惠 ABF 載板需求。'],
    ['3189', '景碩', 'IC 載板', '載板廠,法人將其列為 ABF 載板供應緊俏的受惠股。'],
    ['2368', '金像電', 'PCB(伺服器板)', '以伺服器、網通用高階 PCB 為主。']
])}
<p><span class="tag">待補</span>這一頁的公司說明較簡略,之後可再依各公司財報補上產品占比與客戶。</p>

<h3>相關詞條</h3>
<ul>
  <li><a href="#fiberglass" class="text-emerald-700 underline">電子級玻纖布</a></li>
  <li><a href="#ccl" class="text-emerald-700 underline">銅箔基板 (CCL)</a></li>
</ul>`
        }
    ];

    // ========= 渲染邏輯 =========
    const container = document.getElementById('content-container');
    const navList = document.getElementById('nav-list');

    function showHome() {
        let cards = pages.map(p => `
            <button data-id="${p.id}" class="home-card text-left p-4 border border-gray-200 rounded-xl hover:bg-emerald-50 hover:border-emerald-300 transition cursor-pointer">
                <div class="font-semibold">${p.icon} ${p.title}</div>
                <div class="text-xs text-gray-500 mt-1">${p.subtitle}</div>
            </button>`).join('');
        container.innerHTML = `
            <h2>歡迎來到台股產業知識庫</h2>
            <p>本專案採用 <strong>LLM Wiki</strong> 概念,整理 AI 伺服器相關的材料供應鏈。點選左側選單或下方卡片即可閱讀。</p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 my-4">${cards}</div>
            <div class="bg-amber-50 border-l-4 border-amber-400 p-4 text-amber-800 text-sm rounded-r-lg">
                💡 公司資料整理自公開新聞與法人報導,股價與產業狀況會變動,請以公司公告與財報為準。內容非投資建議。
            </div>`;
        container.querySelectorAll('.home-card').forEach(b =>
            b.addEventListener('click', () => showPage(b.dataset.id)));
        setActive(null);
    }

    function setActive(id) {
        navList.querySelectorAll('.nav-btn').forEach(b =>
            b.classList.toggle('active', b.dataset.id === id));
    }

    function showPage(id) {
        const page = pages.find(p => p.id === id);
        if (!page) return showHome();
        container.innerHTML = page.html;
        setActive(id);
        history.replaceState(null, '', '#' + id);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 建立側邊欄按鈕
    pages.forEach(p => {
        const li = document.createElement('li');
        const btn = document.createElement('button');
        btn.className = 'nav-btn w-full text-left px-3 py-2 rounded-lg hover:bg-emerald-100 transition cursor-pointer';
        btn.dataset.id = p.id;
        btn.innerHTML = `${p.icon} ${p.title}<div class="text-xs font-normal text-gray-500">${p.subtitle}</div>`;
        btn.addEventListener('click', () => showPage(p.id));
        li.appendChild(btn);
        navList.appendChild(li);
    });

    document.getElementById('logo').addEventListener('click', () => {
        history.replaceState(null, '', location.pathname);
        showHome();
    });

    // 內文中的 #連結 (相關詞條) 也能切換頁面
    container.addEventListener('click', e => {
        const a = e.target.closest('a[href^="#"]');
        if (a) { e.preventDefault(); showPage(a.getAttribute('href').slice(1)); }
    });

    // 開啟時依網址 # 決定頁面
    const initial = location.hash.slice(1);
    initial ? showPage(initial) : showHome();
    </script>
</body>
</html>
